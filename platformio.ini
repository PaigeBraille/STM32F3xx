# This is the configuration file for PlatformIO, a cross-platform tool and IDE
# to build and develop software for embedded systems.
#
# To build the firmware with PlatformIO, install PlatformIO Core (CLI, no GUI):
# - https://docs.platformio.org/en/latest//core/installation.html
#
# Ported from the PaigeBraille STM32F1xx configuration for the STM32F303CCT6
# replacement of the F103RC on the BTT SKR MINI E3 V2.0 derived board.
#
# Typical command line usage:
#
#    # Build firmware
#    pio run -e BTT_SKR_MINI_E3_V20
#    # List the freshly built firmware ELF (.elf) and binary (.bin) files:
#    ls -l .pio/build/*/firmware.*
#    # Clean up build related resources
#    pio run -t clean
#

[platformio]
include_dir = Inc
src_dir = Src

[common]
build_flags =
  -I .
  -I boards
  -I Middlewares/ST/STM32_USB_Device_Library/Class/CDC/Inc
  -I Middlewares/ST/STM32_USB_Device_Library/Core/Inc
  -I USB_DEVICE/Target
  -D RX_BUFFER_SIZE=512
  -D NVS_SIZE=4096
  # Ignore all settings in Inc/my_machine.h (and instead use the below build flags)
  -D OVERRIDE_MY_MACHINE
lib_deps =
  boards
  grbl
  motors
  # USB serial support
  Core
  Class
  App
  Target
lib_extra_dirs =
  .
  Middlewares/ST/STM32_USB_Device_Library
  USB_DEVICE

[env]
platform = ststm32
framework = stm32cube
# Do not produce .a files for lib deps (which would prevent them from overriding weak symbols)
lib_archive = no
lib_ldf_mode = off

[env:BTT_SKR_MINI_E3_V20]
board = robotdyn_blackpill_f303cc
board_build.ldscript = STM32F303CCTX_FLASH.ld
build_flags = ${common.build_flags}
  # Board definition
  -D BOARD_BTT_SKR_MINI_E3_V20=
  -D USB_SERIAL_CDC=0

  # Core motion configuration - X/Y axes with endstops (Z axis defined but unused)
  -D N_AXIS=3                 # Must be 3 minimum (X, Y, Z) even though Z has no hardware
  # NOTE: N_ABC_MOTORS is derived by the core now (N_AXIS=3 means 0 ABC motors)

  # Disable all spindle/coolant/laser features
  -D SPINDLE_ENABLE=0         # Disable spindle features (DRIVER_SPINDLE_ENABLE derived from this)
  -D COOLANT_ENABLE=0         # Disable coolant control
  -D LASER_MODE_ENABLE=0      # Disable laser mode
  -D LATHE_MODE_ENABLE=0      # Disable lathe mode

  # Disable control input pins to avoid false triggers
  -D ESTOP_ENABLE=0
  -D SAFETY_DOOR_ENABLE=0
  -D CONTROL_ENABLE=0
  -D LIMITS_OVERRIDE_ENABLE=0
  -D PROBE_DISCONNECT_ENABLE=0
  -D STOP_DISABLE_ENABLE=0

  # Disable probing, parking, and sleep features
  -D PROBE_ENABLE=0           # No G38.x probing needed
  -D PARKING_ENABLE=0         # No tool change parking
  -D SLEEP_ENABLE=0           # No sleep mode

  # Disable peripheral devices
  -D MPG_ENABLE=0             # No manual pulse generator
  -D DISPLAY_ENABLE=0         # No I2C display
  -D KEYPAD_ENABLE=0          # No keypad input
  -D FANS_ENABLE=0            # No fan control
  -D MACROS_ENABLE=0          # No user macros

  # Disable network stack (serial UART only)
  -D BLUETOOTH_ENABLE=0       # No Bluetooth
  -D WIFI_ENABLE=0            # No WiFi
  -D ETHERNET_ENABLE=0        # No Ethernet
  -D TELNET_ENABLE=0          # No Telnet server
  -D WEBSOCKET_ENABLE=0       # No WebSocket
  -D HTTP_ENABLE=0            # No HTTP server
  -D FTP_ENABLE=0             # No FTP server
  -D WEBUI_ENABLE=0           # No web interface

  # Storage configuration
  # NOTE: FLASH_ENABLE is derived in Inc/driver.h (EEPROM_ENABLE=0 enables Flash NVS)
  -D SDCARD_ENABLE=0          # No SD card hardware
  -D EEPROM_ENABLE=0          # Disable external EEPROM (selects internal Flash for NVS)

  # Trinamic TMC2209 driver configuration
  -D TRINAMIC_ENABLE=2209      # Enable TMC2209 UART driver support
  -D TRINAMIC_MIXED_DRIVERS=1  # Enable mixed driver support (allows per-axis enable/disable)
  -D TRINAMIC_DRIVER_MASK=0x03 # Only X and Y axes (bits 0 and 1)
  -D TMC_STEALTHCHOP=1         # Default to StealthChop mode (silent)

  # Homing configuration - Only home X axis
  -D DEFAULT_HOMING_CYCLE_0=1  # Only X axis (bit 0)
  -D DEFAULT_HOMING_CYCLE_1=0  # No second cycle
  -D DEFAULT_HOMING_CYCLE_2=0  # No third cycle

  # Embedded custom settings (only non-default values)
  # Basic settings
  -D DEFAULT_STEPPER_IDLE_LOCK_TIME=60000        # $1: 25 → 60000
  -D DEFAULT_DIR_SIGNALS_INVERT_MASK=1           # $3: invert X direction (bit 0) - verified on hardware
  -D DEFAULT_LIMIT_SIGNALS_PULLUP_DISABLE_MASK=5 # $37: Disable X and Z pullups (bits 0,2) - X sensor is on PB7
  -D DEFAULT_INVERT_PROBE_PIN=On                 # $6: 0 → 1

  # Homing configuration
  # $22 bitmask = 11 (0b00001011): enabled=1, single_axis_commands=1, force_set_origin=1
  -D DEFAULT_HOMING_ENABLE=On                    # $22 bit 0: Enable homing
  -D DEFAULT_HOMING_SINGLE_AXIS_COMMANDS=On      # $22 bit 1: Enable single axis commands ($HX, $HY)
  -D DEFAULT_HOMING_FORCE_SET_ORIGIN=On          # $22 bit 3: Force set origin after homing
  # Hard limits disabled - allows motion without homing first
  -D DEFAULT_HOMING_DIR_MASK=1                   # $23: invert X homing direction (bit 0) - verified on hardware
  -D DEFAULT_HOMING_FEED_RATE=50.0f              # $24: slow touch-off pass (verified on hardware)
  -D DEFAULT_HOMING_SEEK_RATE=200.0f             # $25: seek/approach rate (verified on hardware)
  -D DEFAULT_HOMING_DEBOUNCE_DELAY=150           # $26: 250 → 150
  -D DEFAULT_HOMING_PULLOFF=2.0f                 # $27: 1.0 → 2.0

  # Steps per mm (X and Y only - Z uses default 250)
  -D DEFAULT_X_STEPS_PER_MM=113.16201f           # $100: 250.0 → 113.16
  -D DEFAULT_Y_STEPS_PER_MM=536.58996f           # $101: 250.0 → 536.59

  # Max rates (X and Y only - Z uses default 500)
  -D DEFAULT_X_MAX_RATE=500.0f                   # $110: 500.0 → 500.0
  -D DEFAULT_Y_MAX_RATE=500.0f                   # $111: 500.0 → 500.0

  # Accelerations (X and Y only - Z uses default 10)
  -D DEFAULT_X_ACCELERATION=100.0f               # $120: 10.0 → 100.0
  -D DEFAULT_Y_ACCELERATION=100.0f               # $121: 10.0 → 100.0

lib_deps = ${common.lib_deps}
  trinamic
lib_extra_dirs = ${common.lib_extra_dirs}
# Flashing via external UART programmer (controls BOOT0/RESET)
# Firmware flashes directly to 0x08000000 via the F303 ROM bootloader (USART1 PA9/PA10)
# NOTE: F303CC reports bootloader chip product ID 0x422 (F103RC was 0x414)
